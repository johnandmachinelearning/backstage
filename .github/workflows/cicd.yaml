name: cicd pipeline

on:
  push:
    paths:
    - src/**
    branches:
    - master

  workflow_dispatch:

jobs:
  ci:
    runs-on: self-hosted
    steps:
    - # CRITICAL: Added checkout here so Docker can access your application files to build them
      name: Check out repository
      uses: actions/checkout@v4
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - 
      name: Shorten commit id
      shell: bash
      run: |
        echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
    -
      name: Login to Dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - 
      name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: johnandmachinelearning/library:python-app-${{ env.COMMIT_ID }}

    outputs:
      commit_id: python-app-${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
    -
      name: Check out repository
      uses: actions/checkout@v4
    -
      name: Modify Helm Values
      shell: bash
      run: |
        ls -la
        echo "${{ needs.ci.outputs.commit_id }}"
        sudo curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq
        yq -i '.image.tag="${{ needs.ci.outputs.commit_id }}"' helm-python-app/values.yaml
    -
      name: Commit and Push
      uses: EndBug/add-and-commit@v9
      with:
        message: "Update values with ${{ needs.ci.outputs.commit_id }}"
    - 
      name: Install ArgoCD
      shell: bash
      run: |
        VERSION=$(curl -L -s https://raw.githubusercontent.com/argoproj/argo-cd/stable/VERSION)
        curl -sSL -o argocd-linux-arm64 https://github.com/argoproj/argo-cd/releases/download/v$VERSION/argocd-linux-arm64
        sudo install -m 755 argocd-linux-arm64 /usr/local/bin/argocd
        rm argocd-linux-arm64
    -
      name: Argocd Login
      shell: bash
      run: |
        argocd login argocd-server.argocd \
        --insecure \
        --grpc-web \
        --username admin \
        --password ${{ secrets.ARGOCD_PASSWORD }}
    -
      name: Argocd Sync
      shell: bash
      run: |
        argocd app sync python-app
